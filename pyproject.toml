[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "antigens"
version = "0.1.0"
description = "Explainable antibody component comparison and candidate-assembly platform"
requires-python = ">=3.11"
dependencies = [
    "anarcii>=2.0.8",
    "biopython>=1.84",
    # Gate 6. Ships its reference peptide sets inside the wheel, so window
    # coverage never calls out to a network service at scoring time. MIT.
    # Pulls scipy/pandas/tqdm transitively; only the in-memory exact-match
    # lookup is used here, not the scipy-backed nearest-peptide search.
    "promb>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
antigens = "antigens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
